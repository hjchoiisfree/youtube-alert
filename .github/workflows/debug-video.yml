name: debug-video
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        env:
          KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "key length: ${#KEY}"
          echo "now UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "24h ago UTC: $(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          curl -s "https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=FdCmgrZh310&key=${KEY}"
