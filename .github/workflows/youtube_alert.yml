        "질문이 없는데 있는 것처럼 지어내지 마세요.\n"
        "- 자막에 진행자 질문이 전혀 없으면 이 섹션에는 '진행자 질문 없음 (단독 발언 영상)'이라고만 쓰세요.\n"
        "- 답변은 핵심만 요약하되, 중요한 문장은 **볼드** 처리하세요.\n\n"
        "### 🎯 이선엽이 주목한 섹터·테마\n"
        "- 이선엽 대표는 보통 개별 종목 추천은 하지 않습니다. 그가 실제로 긍정적으로 "
