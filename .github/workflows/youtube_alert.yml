        # ── 배지 ──────────────────────────────────────
        "■ 배지\n"
        "- 이번 신규 영상에서 새로 나온 항목은 날짜 앞에 🆕\n"
        "- 3개월 이상 반복해서 언급된 항목은 날짜 앞에 ⭐\n"
        "- 배지는 섹터 항목에만 붙입니다. 둘 다 해당하면 🆕만 씁니다.\n\n"
        # ── 본문 구조 ─────────────────────────────────
        "■ 본문 구조 (아래 순서와 형식을 그대로 지킬 것)\n\n"
