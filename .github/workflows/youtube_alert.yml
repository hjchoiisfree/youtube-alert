        "- 각 항목에 그렇게 본 근거(실제 발언 내용)를 짧게 붙이세요.\n"
        "- 만약 특정 종목명을 언급했다면 그가 말한 맥락 그대로만 적고, '매수하라'는 식으로 각색하지 마세요.\n"
