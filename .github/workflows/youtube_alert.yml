name: YouTube 이선엽 알림

on:
  workflow_dispatch:

# 외부 cron(예: cron-job.org)이 workflow_dispatch를 호출하는 구조.
# ※ 스케줄을 하루 1회(18:12)에서 4회로 늘려야 한다.
#    권장: 09:10 / 13:10 / 18:10 / 22:10 (KST)
#    2026-08-19 누락 사례의 1차 원인이 '21:05 발행 > 18:12 실행'이었다.
#    금융 유튜브는 장 마감 후 18~22시 업로드가 가장 많다.
#
# 실행이 겹치면 git push 충돌이 날 수 있어 동시 실행을 막는다.
concurrency:
  group: youtube-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests youtube-transcript-api
      - name: 알림 실행
        env:
          YOUTUBE_API_KEY:  ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python checker.py
      - name: 사용량 집계
        if: always()
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python build_usage.py

      - name: 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          touch seen_ids.txt
          mkdir -p archive
          git add seen_ids.txt archive/ 2>/dev/null || true
          git add state/ docs/ 2>/dev/null || true
          git add 관점_종합.md 2>/dev/null || true
          git add channels.json 2>/dev/null || true
          # ⚠️ 필수: 후보 채널 상태. 이게 커밋되지 않으면 러너 초기화 때마다
          # 후보가 사라져서 '2회 등장 시 승격' 카운트가 영원히 1에 머문다.
          git add candidates.json 2>/dev/null || true
          git add rejected.log 2>/dev/null || true
          git add last_audit.txt 2>/dev/null || true
          git add verdicts.json 2>/dev/null || true
          git add transcript_retry.json 2>/dev/null || true
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "update seen_ids, archive, channels, candidates, verdicts, 관점_종합"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "푸시 재시도 $i/3"; sleep 5
          done
          exit 1

      # checker.py가 죽었는데 저장 단계가 if: always()로 성공하면
      # 워크플로 전체가 초록불이 되어 실패를 놓친다. 명시적으로 실패시킨다.
      - name: 실행 실패 표시
        if: failure()
        run: |
          echo "::error::checker.py 실행이 실패했습니다. 위 로그를 확인하세요."
          exit 1
