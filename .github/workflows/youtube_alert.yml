name: YouTube 이선엽 알림

on:
  workflow_dispatch:

# 외부 cron(예: cron-job.org)이 workflow_dispatch를 호출하는 구조.
# 실행이 겹치면 git push 충돌이 날 수 있어 동시 실행을 막는다.
concurrency:
  group: youtube-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests youtube-transcript-api
      - name: 알림 실행
        env:
          YOUTUBE_API_KEY:  ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python checker.py
      - name: 사용량 집계
        if: always()
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python build_usage.py

      - name: 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          touch seen_ids.txt
          mkdir -p archive
          git add seen_ids.txt archive/ 2>/dev/null || true
          git add state/ docs/ 2>/dev/null || true
          git add 관점_종합.md 2>/dev/null || true
          git add channels.json 2>/dev/null || true
          git add rejected.log 2>/dev/null || true
          git add last_audit.txt 2>/dev/null || true
          git add verdicts.json 2>/dev/null || true
          git add transcript_retry.json 2>/dev/null || true
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "update seen_ids, archive, channels, verdicts, 관점_종합"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "푸시 재시도 $i/3"; sleep 5
          done
          exit 1
