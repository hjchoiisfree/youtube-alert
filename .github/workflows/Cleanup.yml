name: 아카이브 격리 (1회용)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 격리 실행
        run: python cleanup_3pro.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A archive verdicts.json 2>/dev/null || true
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "cleanup: 삼프로TV 오염 아카이브 45건 격리"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "푸시 재시도 $i/3"; sleep 5
          done
          exit 1
